{% extends "page.html" %}

{% block content %}
<div style="max-width:900px;margin:auto;padding:40px">

<h1>🤖 Arnold AI - Bengkulu Satu Data</h1>

<div id="chat-box" style="
height:400px;
border:1px solid #ddd;
border-radius:10px;
padding:20px;
overflow:auto;
margin-bottom:20px;
"></div>

<div style="display:flex;gap:10px">
<input id="user-input" type="text"
placeholder="Tanyakan sesuatu..."
style="flex:1;padding:12px;border-radius:8px;border:1px solid #ccc">

<button onclick="sendMessage()" style="
background:#B00000;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
">
Kirim
</button>
</div>

</div>

<script>
document.getElementById("user-input").addEventListener("keypress", function(e){
if(e.key === "Enter"){
sendMessage()
}
})
async function sendMessage(){

const input=document.getElementById("user-input")
const chat=document.getElementById("chat-box")

let msg=input.value.trim()

if(!msg) return

chat.innerHTML += `
<div style="margin-bottom:10px">
<b>Kamu:</b> ${msg}
</div>
`

try{

const res=await fetch("http://localhost:8001/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:msg})
})

const data=await res.json()

chat.innerHTML += `
<div style="margin-bottom:15px;color:#B00000">
<b>Arnold:</b> ${data.reply}
</div>
`

}catch(err){

chat.innerHTML+=`<p><b>Arnold:</b> Maaf terjadi kesalahan.</p>`

}

chat.scrollTop=chat.scrollHeight

input.value=""

}

</script>

{% endblock %}
